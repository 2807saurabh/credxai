spring.application.name=credxai-backend

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/credtest
spring.datasource.username=root
spring.datasource.password=#{DB_PASS}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CredXAI ML APIs
credxai.ml.alternative-url=http://127.0.0.1:8001
credxai.ml.traditional-url=http://127.0.0.1:8002

jwt.secret=#{JWT_SEC}
jwt.expiration=86400000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG