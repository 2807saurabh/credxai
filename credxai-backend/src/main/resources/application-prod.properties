spring.application.name=credxai-backend

# Production database: supplied through Render environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway manages database schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Hibernate validates the Flyway-managed schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Render port
server.port=${PORT:8080}

# Hosted Python ML services
credxai.ml.alternative-url=${ML_ALTERNATIVE_URL}
credxai.ml.traditional-url=${ML_TRADITIONAL_URL}

# Production JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.root=INFO
logging.level.CredXAI=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO